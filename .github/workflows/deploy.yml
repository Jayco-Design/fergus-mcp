name: Build and publish Docker image

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: "Build and Push Image"
    if: github.repository_owner == 'Jayco-Design'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Code Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Docker Login
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            fergusapp/mcp:${{ github.event.release.tag_name }}
            fergusapp/mcp:latest
          labels: |
            org.opencontainers.image.description=Fergus MCP Server
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/fergusapp/fergus-mcp
            org.opencontainers.image.title=Fergus MCP Server
            org.opencontainers.image.url=https://github.com/fergusapp/fergus-mcp
            org.opencontainers.image.vendor=Fergus
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
